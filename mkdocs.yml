site_name: UBEM Agent Casebook
site_description: >-
  Case records of expected agent behavior in urban building energy modeling
  setup, simulation, calibration, and result interpretation workflows.
# Set once the GitHub repository exists, e.g.
# site_url: https://<owner>.github.io/<repo>/
# repo_url: https://github.com/<owner>/<repo>
# edit_uri: edit/main/docs/
copyright: >-
  Content licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - tags

hooks:
  - scripts/casebook.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

validation:
  links:
    anchors: warn
